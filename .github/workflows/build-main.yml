name: Build EXE (main)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE (PyInstaller)
        run: pyinstaller --noconfirm --onefile --windowed --name "AISBench-Prefix-Tools" --icon=app.ico --add-data "requirements.txt;." --add-data "app.ico;." --add-data "aisbench_auto_tools_prefix;aisbench_auto_tools_prefix" main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AISBench-Prefix-Tools-exe-${{ github.sha }}
          path: dist/AISBench-Prefix-Tools.exe
          retention-days: 90
          if-no-files-found: error

      - name: Publish rolling nightly release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.sha }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly dist/AISBench-Prefix-Tools.exe \
            --title "Nightly Build" \
            --notes "main 分支自动构建 (CI 自动维护的滚动 tag, 每次推送覆盖更新)。对应提交: ${COMMIT}" \
            --prerelease
